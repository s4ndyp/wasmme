server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /data/published;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    types {
        application/wasm wasm;
    }

    client_max_body_size 1m;
}
