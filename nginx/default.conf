server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Do not define a bare `types { }` here — it replaces mime.types and makes
    # HTML served as application/octet-stream (browser downloads the page).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /data/published;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map|html)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    client_max_body_size 1m;
}
